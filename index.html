<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nippon Loop | 日本一周マップ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#132238;font-family:system-ui,-apple-system,sans-serif}header{background:linear-gradient(135deg,#102642,#1d4c7b);color:#fff;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.13em}.sub{font-size:12px;opacity:.7}.score{text-align:right;font-size:12px}.score b{display:block;font-size:28px}nav,.wrap{max-width:1100px;margin:auto}nav{padding:14px 16px;display:flex;gap:8px;overflow:auto}button{font:inherit;cursor:pointer}nav button{border:0;border-radius:99px;padding:10px 15px;font-weight:700;background:#e4eaf2;color:#53657a;white-space:nowrap}nav .on{background:#173d68;color:white}.wrap{padding:0 16px 35px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat,.card{background:#fff;border:1px solid #e1e7ef;border-radius:18px;box-shadow:0 8px 28px #173d6810}.stat{padding:14px}.stat b{font-size:27px;display:block}.stat span{font-size:12px;color:#718197}.card{padding:14px}.map{width:100%;background:linear-gradient(#f7fbff,#fff);border-radius:14px}.route{stroke:#7890ac;stroke-width:4}.station{fill:#fff;stroke:#173d68;stroke-width:4;cursor:pointer}.station.done{fill:#18a674;stroke:#087c53}.label{font-size:15px;font-weight:800;fill:#172b43;paint-order:stroke;stroke:#fff;stroke-width:5px}.note{text-align:center;color:#8190a1;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pref{padding:10px;border-radius:10px;border:1px solid #dce4ed;color:#7a899a}.pref.done{background:#ebf9f3;color:#116845;border-color:#b9e4d3;font-weight:700}.history{width:100%;display:flex;justify-content:space-between;text-align:left;border:1px solid #e0e7ef;background:#fff;padding:13px;margin:7px 0;border-radius:12px}.muted{font-size:12px;color:#8190a1}.hidden{display:none}.overlay{position:fixed;inset:0;background:#07122199;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:white;width:min(460px,100%);border-radius:22px;padding:25px}.modal h2{font-size:30px;margin:3px 0 18px}.modal label{display:block;font-size:12px;font-weight:700;margin:12px 0}.modal input,.modal textarea{width:100%;padding:11px;border:1px solid #d7e0e9;border-radius:10px;margin-top:6px}.primary,.danger{width:100%;border:0;border-radius:11px;padding:12px;font-weight:800}.primary{background:#173d68;color:white}.danger{margin-top:8px;background:#fff0f0;color:#a33}footer{text-align:center;color:#93a0af;font-size:11px;padding:20px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.label{font-size:18px}.stat b{font-size:22px}}</style></head><body><header><div><div class="brand">NIPPON LOOP</div><div class="sub">日本一周トラベルマップ</div></div><div class="score"><b id="pct">0%</b>駅マップ達成率</div></header><nav><button class="on" data-tab="map">🗾 全国マップ</button><button data-tab="progress">🏁 達成状況</button><button data-tab="history">📖 旅行履歴</button></nav><main class="wrap"><section id="map"><div class="stats"><div class="stat"><b id="vc">0</b><span>訪問駅</span></div><div class="stat"><b id="pc">0</b><span>訪問都道府県</span></div><div class="stat"><b id="left">23</b><span>未訪問駅</span></div></div><div class="card"><svg id="svg" class="map" viewBox="0 0 850 720"></svg><p class="note">駅をタップして訪問を記録。路線・座標・デザインは本アプリ独自の簡略表現です。</p></div></section><section id="progress" class="card hidden"><h2>47都道府県の進捗</h2><div id="prefs" class="grid"></div></section><section id="history" class="card hidden"><h2>旅行履歴</h2><div id="hist"></div></section></main><footer>Built for journeys across Japan · 記録はこの端末のブラウザに保存されます</footer><div id="modal" class="overlay hidden"><div class="modal"><div class="muted" id="where"></div><h2 id="name"></h2><label>訪問日<input id="date" type="date"></label><label>旅のメモ<textarea id="memo" rows="4" placeholder="食べたもの、景色、思い出など"></textarea></label><button class="primary" id="save">訪問済みにする</button><button class="danger hidden" id="del">訪問記録を削除</button></div></div><script>const S=[['sapporo','札幌','北海道','北海道',760,95],['hakodate','函館','北海道','北海道',715,155],['aomori','青森','青森県','東北',690,215],['morioka','盛岡','岩手県','東北',710,270],['sendai','仙台','宮城県','東北',700,330],['niigata','新潟','新潟県','中部',610,335],['tokyo','東京','東京都','関東',680,420],['yokohama','横浜','神奈川県','関東',655,455],['nagano','長野','長野県','中部',585,400],['kanazawa','金沢','石川県','中部',500,405],['shizuoka','静岡','静岡県','中部',590,470],['nagoya','名古屋','愛知県','中部',515,475],['kyoto','京都','京都府','近畿',445,455],['osaka','大阪','大阪府','近畿',430,490],['kobe','神戸','兵庫県','近畿',395,495],['okayama','岡山','岡山県','中国',340,480],['hiroshima','広島','広島県','中国',275,495],['matsuyama','松山','愛媛県','四国',310,555],['kochi','高知','高知県','四国',365,590],['hakata','博多','福岡県','九州',195,510],['kumamoto','熊本','熊本県','九州',185,565],['kagoshima','鹿児島','鹿児島県','九州',180,640],['naha','那覇','沖縄県','沖縄',80,675]],R=[['sapporo','hakodate'],['hakodate','aomori'],['aomori','morioka'],['morioka','sendai'],['sendai','tokyo'],['niigata','tokyo'],['niigata','nagano'],['nagano','tokyo'],['tokyo','yokohama'],['yokohama','shizuoka'],['shizuoka','nagoya'],['nagano','kanazawa'],['kanazawa','kyoto'],['nagoya','kyoto'],['kyoto','osaka'],['osaka','kobe'],['kobe','okayama'],['okayama','hiroshima'],['hiroshima','hakata'],['okayama','matsuyama'],['matsuyama','kochi'],['hakata','kumamoto'],['kumamoto','kagoshima']],P='北海道 青森県 岩手県 宮城県 秋田県 山形県 福島県 茨城県 栃木県 群馬県 埼玉県 千葉県 東京都 神奈川県 新潟県 富山県 石川県 福井県 山梨県 長野県 岐阜県 静岡県 愛知県 三重県 滋賀県 京都府 大阪府 兵庫県 奈良県 和歌山県 鳥取県 島根県 岡山県 広島県 山口県 徳島県 香川県 愛媛県 高知県 福岡県 佐賀県 長崎県 熊本県 大分県 宮崎県 鹿児島県 沖縄県'.split(' ');let V=JSON.parse(localStorage.getItem('nippon-loop-visits')||'{}'),sel=null;const by=id=>S.find(x=>x[0]===id),svg=document.querySelector('#svg');function draw(){svg.innerHTML='';R.forEach(r=>{let a=by(r[0]),b=by(r[1]),l=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:a[4],y1:a[5],x2:b[4],y2:b[5]}).forEach(([k,v])=>l.setAttribute(k,v));l.setAttribute('class','route');svg.append(l)});S.forEach(s=>{let g=document.createElementNS('http://www.w3.org/2000/svg','g'),c=document.createElementNS('http://www.w3.org/2000/svg','circle'),t=document.createElementNS('http://www.w3.org/2000/svg','text');c.setAttribute('cx',s[4]);c.setAttribute('cy',s[5]);c.setAttribute('r',10);c.setAttribute('class','station '+(V[s[0]]?'done':''));t.setAttribute('x',s[4]+14);t.setAttribute('y',s[5]+5);t.setAttribute('class','label');t.textContent=s[1];g.append(c,t);g.onclick=()=>open(s);svg.append(g)});update()}function update(){let n=Object.keys(V).length,ps=new Set(S.filter(s=>V[s[0]]).map(s=>s[2]));vc.textContent=n;pc.textContent=ps.size;left.textContent=S.length-n;pct.textContent=Math.round(n/S.length*100)+'%';prefs.innerHTML=P.map(p=>`<div class="pref ${ps.has(p)?'done':''}">${ps.has(p)?'✓':'○'} ${p}</div>`).join('');let a=Object.values(V).sort((a,b)=>b.date.localeCompare(a.date));hist.innerHTML=a.length?a.map(v=>{let s=by(v.id);return `<button class="history" onclick="open(by('${v.id}'))"><b>${s[1]} <span class="muted">${s[2]}</span></b><span>${v.date}<br><span class="muted">${v.memo||'メモなし'}</span></span></button>`}).join(''):'<p class="muted">まだ訪問記録がありません。全国マップから登録してください。</p>'}function open(s){sel=s;where.textContent=s[3]+' · '+s[2];name.textContent=s[1];date.value=V[s[0]]?.date||'';memo.value=V[s[0]]?.memo||'';save.textContent=V[s[0]]?'記録を更新する':'訪問済みにする';del.classList.toggle('hidden',!V[s[0]]);modal.classList.remove('hidden')}save.onclick=()=>{V[sel[0]]={id:sel[0],date:date.value||new Date().toISOString().slice(0,10),memo:memo.value};localStorage.setItem('nippon-loop-visits',JSON.stringify(V));modal.classList.add('hidden');draw()};del.onclick=()=>{delete V[sel[0]];localStorage.setItem('nippon-loop-visits',JSON.stringify(V));modal.classList.add('hidden');draw()};modal.onclick=e=>{if(e.target===modal)modal.classList.add('hidden')};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['map','progress','history'].forEach(x=>document.querySelector('#'+x).classList.toggle('hidden',x!==b.dataset.tab))});draw();</script></body></html>
