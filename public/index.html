<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nippon Loop | 日本一周マップ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f7fb;--text:#132238;--muted:#6f8094;--panel:#fff;--border:#dfe6ef;--navy:#173d68}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh}header{height:64px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:#102642;color:#fff}
.brand{font-weight:900;letter-spacing:.12em;font-size:17px}.sub{font-size:11px;opacity:.75;margin-top:2px}.score{text-align:right;font-size:10px;opacity:.85}.score b{display:block;font-size:22px;line-height:1}
main{padding:10px 10px calc(12px + env(safe-area-inset-bottom));max-width:1400px;margin:auto}
.legend{display:flex;gap:6px;overflow-x:auto;padding:1px 0 9px;scrollbar-width:none}.legend::-webkit-scrollbar{display:none}
.legend-item{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:7px 10px;font-size:12px;white-space:nowrap}
.legend-dot{width:10px;height:10px;border-radius:50%}
.map-wrap{position:relative;background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden}
#map{height:calc(100dvh - 132px);min-height:520px;max-height:860px;width:100%;background:#e9eef4}
.metrics{position:absolute;z-index:500;top:10px;left:10px;display:flex;gap:6px;pointer-events:none}
.metric{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border:1px solid rgba(205,215,226,.9);border-radius:12px;padding:7px 9px;min-width:72px}
.metric b{display:block;font-size:18px;line-height:1.05}.metric span{font-size:9px;color:var(--muted)}
.loading{position:absolute;z-index:520;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(16,38,66,.9);color:white;border-radius:999px;padding:8px 12px;font-size:12px;white-space:nowrap}
.loading.hidden{display:none}
.note{position:absolute;z-index:500;right:10px;bottom:10px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:9px;padding:5px 8px;font-size:9px;color:var(--muted);max-width:230px}
.pin{width:15px;height:15px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 5px #0005}
.pin::after{content:"";position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;left:3.5px;top:3.5px}
.leaflet-div-icon{background:transparent;border:0}.leaflet-control-attribution{font-size:8px}
.leaflet-tooltip{font-size:12px;font-weight:700;border:0;border-radius:7px;box-shadow:0 2px 10px #0002}
.route-line{stroke-linecap:round}
.sheet-backdrop{position:fixed;inset:0;background:#07122166;z-index:2000;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet-backdrop.hidden{display:none}.sheet{width:min(520px,100%);background:#fff;border-radius:20px;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}.sheet h2{margin:2px 0 0;font-size:27px}.sheet small{color:var(--muted)}
.close{border:0;background:#eef2f6;width:36px;height:36px;border-radius:50%;font-size:21px;color:#455a72}
.status-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.status-btn{border:1px solid var(--border);background:#fff;border-radius:13px;padding:12px;text-align:left;font:inherit;font-weight:800;color:var(--text)}
.status-btn span{font-size:20px;margin-right:7px}.status-btn.active{border-width:2px}
footer{font-size:9px;color:#7d8b9c;text-align:center;padding:8px 12px 12px}
@media(max-width:640px){header{height:58px;padding:8px 12px}.brand{font-size:15px}.score b{font-size:20px}main{padding:8px}#map{height:calc(100dvh - 118px);min-height:480px}.metric{min-width:64px;padding:6px 8px}.metric b{font-size:16px}.status-grid{grid-template-columns:1fr 1fr}.note{display:none}}
</style>
</head>
<body>
<header>
  <div><div class="brand">NIPPON LOOP</div><div class="sub">桃鉄2020 物件駅ベース · 日本一周管理</div></div>
  <div class="score"><b id="pct">0%</b>338駅 到達率</div>
</header>
<main>
  <div id="legend" class="legend"></div>
  <section class="map-wrap">
    <div id="map"></div>
    <div class="metrics">
      <div class="metric"><b id="visited">0</b><span>通過以上</span></div>
      <div class="metric"><b id="stayed">0</b><span>泊まった以上</span></div>
      <div class="metric"><b id="left">338</b><span>行ってない</span></div>
    </div>
    <div id="loading" class="loading">都市位置を読み込み中…</div>
    <div class="note">線は地理的に近い都市を結ぶ簡略ネットワークです</div>
  </section>
</main>
<footer>地図 © OpenStreetMap contributors · 自治体位置: code4fukui/localgovjp · 駅名: Game8参考</footer>
<div id="sheetBackdrop" class="sheet-backdrop hidden">
  <div class="sheet">
    <div class="sheet-head">
      <div><small id="sheetRegion"></small><h2 id="sheetName"></h2></div>
      <button id="closeSheet" class="close" aria-label="閉じる">×</button>
    </div>
    <div id="statusGrid" class="status-grid"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/data/hokkaido.js"></script>
<script src="/data/tohoku.js"></script>
<script src="/data/kanto.js"></script>
<script src="/data/chubu.js"></script>
<script src="/data/kinki.js"></script>
<script src="/data/chugoku.js"></script>
<script src="/data/shikoku.js"></script>
<script src="/data/kyushu.js"></script>
<script>
const STATIONS=Object.entries(window.STATION_REGIONS||{}).flatMap(([region,names])=>names.map((name,i)=>({id:`${region}-${i}`,name,region})));
const LEVELS=[
  {name:"行ってない",icon:"○",color:"#9aa7b5"},
  {name:"通過した",icon:"🚃",color:"#4f83cc"},
  {name:"歩いた",icon:"👟",color:"#24a176"},
  {name:"飲んだ",icon:"🍺",color:"#d99520"},
  {name:"泊まった",icon:"🛏️",color:"#7d59b5"},
  {name:"住んだ",icon:"🏠",color:"#cf4f78"}
];
const REGION_PREFS={
"北海道":["北海道"],
"東北":["青森県","岩手県","宮城県","秋田県","山形県","福島県"],
"関東":["茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県"],
"中部":["新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県"],
"近畿":["三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県"],
"中国":["鳥取県","島根県","岡山県","広島県","山口県"],
"四国":["徳島県","香川県","愛媛県","高知県"],
"九州・沖縄":["福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]
};
const ALIAS={
"ススキノ":"札幌市 中央区","定山渓":"札幌市 南区","襟裳":"えりも町","摩周":"弟子屈町","阿寒":"釧路市",
"竜飛":"外ヶ浜町","鳴子":"大崎市","金木":"五所川原市","菜の花":"横浜町",
"幕張":"千葉市 美浜区","浅草":"台東区","お台場":"港区","千駄ヶ谷":"渋谷区","東京":"千代田区","銀座":"中央区",
"原宿":"渋谷区","日本橋":"中央区","後楽園":"文京区","上野":"台東区","秋葉原":"千代田区","中華街":"横浜市 中区",
"佐原":"香取市","大久保":"新宿区","伊豆大島":"大島町","八丈島":"八丈町",
"名古屋港":"名古屋市 港区","香林坊":"金沢市","栄":"名古屋市 中区","茶屋街":"金沢市","修善寺":"伊豆市",
"和倉温泉":"七尾市","東尋坊":"坂井市","伊豆高原":"伊東市","小淵沢":"北杜市",
"天保山":"大阪市 港区","北浜":"大阪市 中央区","天王寺":"大阪市 天王寺区","なんば":"大阪市 中央区","京橋":"大阪市 都島区",
"嵐山":"京都市 右京区","有馬":"神戸市 北区","城崎":"豊岡市","祇園":"京都市 東山区","淡路島":"洲本市","出石":"豊岡市","鶴橋":"大阪市 生野区",
"鞆の浦":"福山市","石見銀山":"大田市","湯田温泉":"山口市","生口島":"尾道市","大根島":"松江市","仙崎":"長門市",
"蒜山":"真庭市","日生":"備前市","宮島":"廿日市市",
"道後":"松山市","大三島":"今治市","四万十川":"四万十市",
"中洲":"福岡市 博多区","博多":"福岡市 博多区","門司港":"北九州市 門司区","小倉":"北九州市 小倉北区",
"湯布院":"由布市","屋久島":"屋久島町","知覧":"南九州市","奄美大島":"奄美市","石垣島":"石垣市",
"種子島":"西之表市","秋月":"朝倉市","桜島":"鹿児島市","茂木":"長崎市"
};
let visits=JSON.parse(localStorage.getItem("nippon-loop-visits-v3")||"{}");
let currentStation=null;
let markerById=new Map();
let pointById=new Map();
let routeLayer=null;

const map=L.map("map",{zoomControl:true,preferCanvas:true,minZoom:4,maxZoom:15}).setView([36.2,138.2],5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

document.getElementById("legend").innerHTML=LEVELS.map(l=>`<div class="legend-item"><i class="legend-dot" style="background:${l.color}"></i><span>${l.icon} ${l.name}</span></div>`).join("");

function levelOf(id){return Number(visits[id]?.level||0)}
function updateStats(){
  const levels=STATIONS.map(s=>levelOf(s.id));
  const v=levels.filter(x=>x>=1).length;
  const st=levels.filter(x=>x>=4).length;
  document.getElementById("visited").textContent=v;
  document.getElementById("stayed").textContent=st;
  document.getElementById("left").textContent=STATIONS.length-v;
  document.getElementById("pct").textContent=Math.round(v/STATIONS.length*100)+"%";
}
function pinIcon(level){
  return L.divIcon({
    className:"",
    html:`<div class="pin" style="background:${LEVELS[level].color}"></div>`,
    iconSize:[18,22],iconAnchor:[9,20],tooltipAnchor:[0,-16]
  });
}
function norm(s){
  return String(s||"").normalize("NFKC").replace(/[ヶケ]/g,"ケ").replace(/\s+/g,"").replace(/市(?=[^市]*区$)/,"").replace(/[市町村区]$/,"");
}
function parseCSV(text){
  const rows=[];let row=[],field="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')q=false;else field+=ch}
    else{if(ch==='"')q=true;else if(ch===','){row.push(field);field=""}else if(ch==='\n'){row.push(field.replace(/\r$/,"") );rows.push(row);row=[];field=""}else field+=ch}
  }
  if(field||row.length){row.push(field);rows.push(row)}
  return rows;
}
async function loadMunicipalities(){
  const urls=[
    "https://raw.githubusercontent.com/code4fukui/localgovjp/master/localgovjp-utf8.csv",
    "https://code4fukui.github.io/localgovjp/localgovjp-utf8.csv"
  ];
  let text="";
  for(const u of urls){try{const r=await fetch(u);if(r.ok){text=await r.text();break}}catch(e){}}
  if(!text)throw new Error("自治体位置データを取得できませんでした");
  const rows=parseCSV(text.replace(/^\uFEFF/,""));
  const head=rows.shift();
  const ix=Object.fromEntries(head.map((h,i)=>[h,i]));
  return rows.filter(r=>r.length>6).map(r=>({
    pref:r[ix.pref],city:r[ix.city],lat:Number(r[ix.lat]),lng:Number(r[ix.lng]),key:norm(r[ix.city])
  })).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lng));
}
function findMunicipality(station,munis){
  const allowed=new Set(REGION_PREFS[station.region]||[]);
  const alias=ALIAS[station.name];
  if(alias){
    const hit=munis.find(m=>allowed.has(m.pref)&&m.city===alias);
    if(hit)return hit;
  }
  const key=norm(station.name);
  const candidates=munis.filter(m=>allowed.has(m.pref)&&m.key===key);
  if(candidates.length)return candidates.find(m=>!m.city.includes(" "))||candidates[0];
  return null;
}
function hav(a,b){
  const R=6371,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lng-a.lng)*p;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function drawNetwork(points){
  if(routeLayer)routeLayer.remove();
  const edges=new Map();
  for(const a of points){
    const near=points.filter(b=>b.id!==a.id).map(b=>[b,hav(a,b)]).sort((x,y)=>x[1]-y[1]);
    const picks=near.slice(0,1).concat(near.filter(x=>x[1]<85).slice(1,2));
    for(const [b,d] of picks){
      const key=[a.id,b.id].sort().join("|");
      if(!edges.has(key))edges.set(key,[a,b,d]);
    }
  }
  routeLayer=L.layerGroup([...edges.values()].map(([a,b,d])=>L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{
    color:"#7089a8",weight:1.2,opacity:d>150?.18:.32,interactive:false
  }))).addTo(map);
  routeLayer.bringToBack();
}
function addMarker(s,loc){
  const p={...s,lat:loc.lat,lng:loc.lng,pref:loc.pref,municipality:loc.city};
  pointById.set(s.id,p);
  const marker=L.marker([p.lat,p.lng],{icon:pinIcon(levelOf(s.id)),keyboard:false}).addTo(map);
  marker.bindTooltip(s.name,{direction:"top",offset:[0,-8],opacity:.96});
  marker.on("click",()=>openSheet(p));
  markerById.set(s.id,marker);
}
function openSheet(station){
  currentStation=station;
  document.getElementById("sheetRegion").textContent=`${station.pref||station.region} · ${station.municipality||""}`;
  document.getElementById("sheetName").textContent=station.name;
  const grid=document.getElementById("statusGrid");
  grid.innerHTML=LEVELS.map((l,i)=>`<button class="status-btn ${levelOf(station.id)===i?"active":""}" data-level="${i}" style="${levelOf(station.id)===i?`border-color:${l.color}`:''}"><span>${l.icon}</span>${l.name}</button>`).join("");
  grid.querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>setLevel(station,Number(btn.dataset.level))));
  document.getElementById("sheetBackdrop").classList.remove("hidden");
}
function setLevel(station,level){
  if(level===0)delete visits[station.id];else visits[station.id]={level,updatedAt:new Date().toISOString()};
  localStorage.setItem("nippon-loop-visits-v3",JSON.stringify(visits));
  const marker=markerById.get(station.id);if(marker)marker.setIcon(pinIcon(level));
  updateStats();
  closeSheet();
}
function closeSheet(){document.getElementById("sheetBackdrop").classList.add("hidden");currentStation=null}
document.getElementById("closeSheet").addEventListener("click",closeSheet);
document.getElementById("sheetBackdrop").addEventListener("click",e=>{if(e.target.id==="sheetBackdrop")closeSheet()});
updateStats();

(async()=>{
  const loading=document.getElementById("loading");
  try{
    const munis=await loadMunicipalities();
    const resolved=[],unresolved=[];
    for(const s of STATIONS){
      const loc=findMunicipality(s,munis);
      if(loc){addMarker(s,loc);resolved.push({...s,lat:loc.lat,lng:loc.lng})}else unresolved.push(s);
    }
    drawNetwork(resolved);
    if(resolved.length)map.fitBounds(L.latLngBounds(resolved.map(p=>[p.lat,p.lng])),{padding:[28,28],maxZoom:6});
    loading.textContent=unresolved.length?`${resolved.length} / 338地点を表示（${unresolved.length}地点は位置確認中）`:`338地点を表示`;
    setTimeout(()=>loading.classList.add("hidden"),unresolved.length?4500:1600);
  }catch(err){
    loading.textContent="都市位置データの読み込みに失敗しました。再読み込みしてください";
  }
})();
</script>
</body>
</html>
