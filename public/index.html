<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nippon Loop | 桃鉄2020物件駅ベース</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#132238;font-family:system-ui,-apple-system,sans-serif}header{background:linear-gradient(135deg,#102642,#1d4c7b);color:#fff;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.13em}.sub{font-size:12px;opacity:.75}.score{text-align:right;font-size:12px}.score b{display:block;font-size:28px}nav,.wrap{max-width:1100px;margin:auto}nav{padding:14px 16px;display:flex;gap:8px;overflow:auto}button{font:inherit;cursor:pointer}nav button{border:0;border-radius:99px;padding:10px 15px;font-weight:700;background:#e4eaf2;color:#53657a;white-space:nowrap}nav .on{background:#173d68;color:white}.wrap{padding:0 16px 35px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat,.card{background:#fff;border:1px solid #e1e7ef;border-radius:18px;box-shadow:0 8px 28px #173d6810}.stat{padding:14px}.stat b{font-size:27px;display:block}.stat span{font-size:12px;color:#718197}.card{padding:18px}.mapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.region{border:1px solid #dce4ed;border-radius:16px;padding:16px;background:linear-gradient(#fbfdff,#f7fbff);text-align:left}.region h3{margin:0 0 4px}.region b{font-size:24px}.region span{font-size:12px;color:#728198}.region .bar{height:8px;background:#e5ebf2;border-radius:99px;margin-top:10px;overflow:hidden}.region .bar i{display:block;height:100%;background:#18a674}.search{width:100%;padding:13px 15px;border:1px solid #d7e0ea;border-radius:12px;margin-bottom:14px}.stationGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stationBtn{border:1px solid #dce4ed;background:#fff;padding:10px 11px;border-radius:10px;text-align:left}.stationBtn.done{background:#ebf9f3;border-color:#b9e4d3;color:#116845;font-weight:700}.sectionTitle{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:18px 0 10px}.sectionTitle h2{margin:0}.sectionTitle span{font-size:12px;color:#7b899a}.history{width:100%;display:flex;justify-content:space-between;text-align:left;border:1px solid #e0e7ef;background:#fff;padding:13px;margin:7px 0;border-radius:12px}.muted{font-size:12px;color:#8190a1}.hidden{display:none}.overlay{position:fixed;inset:0;background:#07122199;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.hidden{display:none}.modal{background:white;width:min(460px,100%);border-radius:22px;padding:25px}.modal h2{font-size:30px;margin:3px 0 18px}.modal label{display:block;font-size:12px;font-weight:700;margin:12px 0}.modal input,.modal textarea{width:100%;padding:11px;border:1px solid #d7e0e9;border-radius:10px;margin-top:6px}.primary,.danger{width:100%;border:0;border-radius:11px;padding:12px;font-weight:800}.primary{background:#173d68;color:white}.danger{margin-top:8px;background:#fff0f0;color:#a33}footer{text-align:center;color:#93a0af;font-size:11px;padding:20px}@media(max-width:750px){.mapgrid,.stationGrid{grid-template-columns:repeat(2,1fr)}.stat b{font-size:22px}}@media(max-width:420px){.stationGrid{grid-template-columns:1fr}}
</style></head><body>
<header><div><div class="brand">NIPPON LOOP</div><div class="sub">桃鉄2020 物件駅ベース · 日本一周管理</div></div><div class="score"><b id="pct">0%</b>338物件駅 達成率</div></header>
<nav><button class="on" data-tab="map">🗾 地方マップ</button><button data-tab="stations">🚉 全338駅</button><button data-tab="history">📖 旅行履歴</button></nav>
<main class="wrap">
<section id="map"><div class="stats"><div class="stat"><b id="vc">0</b><span>訪問済み物件駅</span></div><div class="stat"><b id="rc">0</b><span>訪問済み地方</span></div><div class="stat"><b id="left">338</b><span>未訪問物件駅</span></div></div><div class="card"><div class="sectionTitle"><h2>地方別進捗</h2><span>地方をタップして駅一覧へ</span></div><div id="regions" class="mapgrid"></div></div></section>
<section id="stations" class="card hidden"><div class="sectionTitle"><h2>桃鉄2020 物件駅一覧</h2><span>Game8掲載の物件駅を基準に構成</span></div><input id="search" class="search" placeholder="駅名を検索（例：札幌、出雲、那覇）"><div id="stationList"></div></section>
<section id="history" class="card hidden"><h2>旅行履歴</h2><div id="hist"></div></section>
</main><footer>駅名リスト: Game8「桃鉄スイッチ 全物件（駅）一覧」参考 · 訪問記録はこの端末に保存</footer>
<div id="modal" class="overlay hidden"><div class="modal"><div class="muted" id="where"></div><h2 id="name"></h2><label>訪問日<input id="date" type="date"></label><label>旅のメモ<textarea id="memo" rows="4" placeholder="食べたもの、景色、思い出など"></textarea></label><button class="primary" id="save">訪問済みにする</button><button class="danger hidden" id="del">訪問記録を削除</button></div></div>
<script>
const DATA={"北海道":["洞爺湖","札幌","ニセコ","釧路","苫小牧","旭川","余市","美瑛","富良野","函館","上川","室蘭","夕張","稚内","網走","池田","羅臼","定山渓","根室","芽室","留萌","増毛","襟裳","紋別","ススキノ","浜頓別","登別","江差","中標津","興部","和寒","帯広","松前","小樽","礼文","別海","厚岸","北見","砂川","足寄","中札内","陸別","利尻","摩周","長万部","天塩","遠軽","斜里","美幌","阿寒","八雲","名寄","森"],"東北":["登米","釜石","仙台","いわき","福島","青森","酒田","三沢","鳴子","郡山","五所川原","鶴岡","竜飛","大間","石巻","花巻","角館","平泉","八戸","横手","女川","金木","三戸","会津若松","山形","弘前","天童","米沢","名取","気仙沼","田子","むつ","菜の花","黒石","大船渡","遠野","秋田","盛岡","久慈","松島","喜多方"],"関東":["幕張","品川","横浜","浅草","川崎","横須賀","お台場","新宿","千駄ヶ谷","東京","千葉","銀座","原宿","日本橋","熊谷","さいたま","前橋","後楽園","上野","船橋","渋谷","秩父","八王子","秋葉原","箱根","水戸","館山","ひたちなか","草津","高崎","中華街","鎌倉","桐生","栃木","鴨川","湯河原","銚子","那須","深谷","北茨城","佐原","大久保","伊豆大島","笠間","土浦","宇都宮","八丈島","沼田","小田原"],"中部":["豊田","名古屋","名古屋港","浜松","小松","湯沢","新潟","安城","瀬戸","豊橋","熱海","香林坊","三島","高岡","長野","白馬","金沢","栄","長岡","茶屋街","軽井沢","修善寺","上田","上越","岡崎","富士宮","福井","富士吉田","和倉温泉","富山","東尋坊","中津川","高山","村上","甲府","常滑","魚沼","土岐","郡上","射水","伊豆高原","松崎","静岡","糸魚川","鯖江","敦賀","駒ヶ根","松本","小布施","佐渡","岐阜","氷見","小淵沢","千曲","下田","小浜"],"近畿":["京都","天保山","門真","姫路","北浜","天王寺","四日市","神戸","なんば","吹田","大津","伊勢","福知山","長浜","大阪","京橋","白浜","奈良","嵐山","津","有馬","堺","近江八幡","城崎","松阪","鳥羽","赤穂","岸和田","祇園","伊賀","御坊","彦根","五條","三田","新宮","明石","淡路島","和歌山","出石","橿原","鶴橋","舞鶴"],"中国":["岡山","尾道","鞆の浦","宇部","福山","広島","山口","石見銀山","境港","呉","下関","湯田温泉","萩","津和野","柳井","生口島","安来","大根島","倉敷","仙崎","蒜山","松江","鳥取","浜田","岩国","日生","宮島","出雲"],"四国":["鳴門","坂出","四国中央","今治","道後","松山","徳島","高松","大三島","須崎","高知","土佐清水","宇和島","四万十川","さぬき","安芸"],"九州・沖縄":["日田","熊本","久留米","中洲","佐世保","博多","太宰府","鳥栖","本部","門司港","那覇","小倉","宮古島","水俣","湯布院","有田","宮崎","諫早","長崎","人吉","屋久島","知覧","佐賀","天草","久米島","西都","別府","名護","壱岐","鹿児島","五島","奄美大島","鹿屋","石垣島","都城","竹田","枕崎","伊万里","対馬","秋月","八代","中津","糸島","茂木","大宜味","大分","飯塚","桜島","唐津","種子島","うるま","小城","金武"]}; const ALL=Object.entries(DATA).flatMap(([region,names])=>names.map((name,i)=>({id:region+'-'+i,name,region})));
let V=JSON.parse(localStorage.getItem('nippon-loop-visits-v2')||'{}'), sel=null;
const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function update(){ const n=Object.keys(V).length, activeRegions=new Set(ALL.filter(s=>V[s.id]).map(s=>s.region)); vc.textContent=n; rc.textContent=activeRegions.size; left.textContent=ALL.length-n; pct.textContent=Math.round(n/ALL.length*100)+'%'; regions.innerHTML=Object.entries(DATA).map(([r,names])=>{const done=names.filter((_,i)=>V[r+'-'+i]).length,p=Math.round(done/names.length*100);return `<button class="region" onclick="showRegion('${r}')"><h3>${r}</h3><b>${done} / ${names.length}</b><span> 物件駅</span><div class="bar"><i style="width:${p}%"></i></div></button>`}).join(''); renderStations(search.value||''); const a=Object.entries(V).sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||'')); hist.innerHTML=a.length?a.map(([id,v])=>{const s=ALL.find(x=>x.id===id);return s?`<button class="history" onclick="openStation('${id}')"><b>${esc(s.name)} <span class="muted">${s.region}</span></b><span>${v.date||''}<br><span class="muted">${esc(v.memo||'メモなし')}</span></span></button>`:''}).join(''):'<p class="muted">まだ訪問記録がありません。</p>'; }
function renderStations(q=''){const needle=q.trim().toLowerCase();stationList.innerHTML=Object.entries(DATA).map(([r,names])=>{const list=names.map((name,i)=>({name,id:r+'-'+i})).filter(s=>!needle||s.name.toLowerCase().includes(needle));if(!list.length)return '';return `<div class="sectionTitle"><h2>${r}</h2><span>${list.length}駅</span></div><div class="stationGrid">${list.map(s=>`<button class="stationBtn ${V[s.id]?'done':''}" onclick="openStation('${s.id}')">${V[s.id]?'✓ ':''}${esc(s.name)}</button>`).join('')}</div>`}).join('')}
function openStation(id){sel=ALL.find(s=>s.id===id);where.textContent=sel.region;name.textContent=sel.name;date.value=V[id]?.date||'';memo.value=V[id]?.memo||'';save.textContent=V[id]?'記録を更新する':'訪問済みにする';del.classList.toggle('hidden',!V[id]);modal.classList.remove('hidden')}
function showRegion(r){document.querySelector('[data-tab="stations"]').click();search.value='';renderStations('');const h=[...document.querySelectorAll('#stationList h2')].find(x=>x.textContent===r);if(h)h.scrollIntoView({behavior:'smooth'})}
save.onclick=()=>{V[sel.id]={date:date.value||new Date().toISOString().slice(0,10),memo:memo.value};localStorage.setItem('nippon-loop-visits-v2',JSON.stringify(V));modal.classList.add('hidden');update()}; del.onclick=()=>{delete V[sel.id];localStorage.setItem('nippon-loop-visits-v2',JSON.stringify(V));modal.classList.add('hidden');update()}; modal.onclick=e=>{if(e.target===modal)modal.classList.add('hidden')};search.oninput=()=>renderStations(search.value);document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['map','stations','history'].forEach(x=>document.querySelector('#'+x).classList.toggle('hidden',x!==b.dataset.tab))});update();
</script></body></html>
