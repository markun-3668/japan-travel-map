<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nippon Loop | 全国マップ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#132238;font-family:system-ui,-apple-system,sans-serif}header{background:linear-gradient(135deg,#102642,#1d4c7b);color:#fff;padding:18px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.13em}.sub{font-size:12px;opacity:.75}.score{text-align:right;font-size:12px}.score b{display:block;font-size:28px}.wrap{max-width:1400px;margin:auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.stat,.card{background:#fff;border:1px solid #e1e7ef;border-radius:18px;box-shadow:0 8px 28px #173d6810}.stat{padding:13px}.stat b{font-size:26px;display:block}.stat span,.muted{font-size:12px;color:#718197}.card{padding:12px}.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:12px}.levelKey{border:1px solid #dfe6ef;border-radius:10px;padding:8px;text-align:center;background:#fff;font-size:12px}.levelKey span{font-size:18px}.mapShell{overflow:hidden;border-radius:14px;background:linear-gradient(#f8fbff,#fff);touch-action:none}.mapCanvas{width:100%;height:min(74vh,850px);display:block;cursor:grab}.mapCanvas:active{cursor:grabbing}.route{stroke:#c8d4e1;stroke-width:2}.station{stroke:#fff;stroke-width:1.4;cursor:pointer}.stationLabel{font-size:7px;font-weight:700;fill:#20344c;paint-order:stroke;stroke:#fff;stroke-width:2.2px}.s0{fill:#aeb9c6}.s1{fill:#5f8fd8}.s2{fill:#28a879}.s3{fill:#e7a32b}.s4{fill:#8b61c2}.s5{fill:#d6537e}.controls{display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px}.controls button{border:0;border-radius:10px;padding:8px 11px;background:#e8eef5;color:#27415f;font-weight:800}.overlay{position:fixed;inset:0;background:#07122199;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.hidden{display:none}.modal{background:#fff;width:min(440px,100%);border-radius:22px;padding:24px}.modal h2{font-size:30px;margin:3px 0 16px}.statusPicker{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.statusChoice{border:1px solid #dfe6ef;border-radius:12px;padding:13px 10px;text-align:left;font-weight:800}.statusChoice span{font-size:18px;margin-right:7px}.statusChoice:hover{background:#f5f8fc}.close{margin-top:12px;width:100%;border:0;border-radius:10px;padding:10px;background:#edf1f5;color:#52657b;font-weight:700}footer{text-align:center;color:#93a0af;font-size:11px;padding:18px}@media(max-width:700px){.levels{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:21px}.mapCanvas{height:68vh}.stationLabel{font-size:8px}.statusPicker{grid-template-columns:1fr}}</style></head><body><header><div><div class="brand">NIPPON LOOP</div><div class="sub">桃鉄2020 物件駅ベース · 全国マップ</div></div><div class="score"><b id="pct">0%</b>338物件駅 到達率</div></header><main class="wrap"><div id="levelLegend" class="levels"></div><div class="stats"><div class="stat"><b id="visited">0</b><span>通過以上</span></div><div class="stat"><b id="stayed">0</b><span>泊まった以上</span></div><div class="stat"><b id="left">338</b><span>行ってない</span></div></div><section class="card"><div class="controls"><button id="zoomOut">−</button><button id="reset">全体表示</button><button id="zoomIn">＋</button></div><div class="mapShell"><svg id="map" class="mapCanvas" viewBox="0 0 1200 1000"><g id="viewport"></g></svg></div></section></main><footer>駅名リスト: Game8「桃鉄スイッチ 全物件（駅）一覧」参考 · 記録はこの端末のブラウザに保存</footer><div id="modal" class="overlay hidden"><div class="modal"><div class="muted" id="where"></div><h2 id="name"></h2><div id="statusPicker" class="statusPicker"></div><button class="close" id="closeModal">閉じる</button></div></div><script>const DATA={"北海道":["洞爺湖","札幌","ニセコ","釧路","苫小牧","旭川","余市","美瑛","富良野","函館","上川","室蘭","夕張","稚内","網走","池田","羅臼","定山渓","根室","芽室","留萌","増毛","襟裳","紋別","ススキノ","浜頓別","登別","江差","中標津","興部","和寒","帯広","松前","小樽","礼文","別海","厚岸","北見","砂川","足寄","中札内","陸別","利尻","摩周","長万部","天塩","遠軽","斜里","美幌","阿寒","八雲","名寄","森"],"東北":["登米","釜石","仙台","いわき","福島","青森","酒田","三沢","鳴子","郡山","五所川原","鶴岡","竜飛","大間","石巻","花巻","角館","平泉","八戸","横手","女川","金木","三戸","会津若松","山形","弘前","天童","米沢","名取","気仙沼","田子","むつ","菜の花","黒石","大船渡","遠野","秋田","盛岡","久慈","松島","喜多方"],"関東":["幕張","品川","横浜","浅草","川崎","横須賀","お台場","新宿","千駄ヶ谷","東京","千葉","銀座","原宿","日本橋","熊谷","さいたま","前橋","後楽園","上野","船橋","渋谷","秩父","八王子","秋葉原","箱根","水戸","館山","ひたちなか","草津","高崎","中華街","鎌倉","桐生","栃木","鴨川","湯河原","銚子","那須","深谷","北茨城","佐原","大久保","伊豆大島","笠間","土浦","宇都宮","八丈島","沼田","小田原"],"中部":["豊田","名古屋","名古屋港","浜松","小松","湯沢","新潟","安城","瀬戸","豊橋","熱海","香林坊","三島","高岡","長野","白馬","金沢","栄","長岡","茶屋街","軽井沢","修善寺","上田","上越","岡崎","富士宮","福井","富士吉田","和倉温泉","富山","東尋坊","中津川","高山","村上","甲府","常滑","魚沼","土岐","郡上","射水","伊豆高原","松崎","静岡","糸魚川","鯖江","敦賀","駒ヶ根","松本","小布施","佐渡","岐阜","氷見","小淵沢","千曲","下田","小浜"],"近畿":["京都","天保山","門真","姫路","北浜","天王寺","四日市","神戸","なんば","吹田","大津","伊勢","福知山","長浜","大阪","京橋","白浜","奈良","嵐山","津","有馬","堺","近江八幡","城崎","松阪","鳥羽","赤穂","岸和田","祇園","伊賀","御坊","彦根","五條","三田","新宮","明石","淡路島","和歌山","出石","橿原","鶴橋","舞鶴"],"中国":["岡山","尾道","鞆の浦","宇部","福山","広島","山口","石見銀山","境港","呉","下関","湯田温泉","萩","津和野","柳井","生口島","安来","大根島","倉敷","仙崎","蒜山","松江","鳥取","浜田","岩国","日生","宮島","出雲"],"四国":["鳴門","坂出","四国中央","今治","道後","松山","徳島","高松","大三島","須崎","高知","土佐清水","宇和島","四万十川","さぬき","安芸"],"九州・沖縄":["日田","熊本","久留米","中洲","佐世保","博多","太宰府","鳥栖","本部","門司港","那覇","小倉","宮古島","水俣","湯布院","有田","宮崎","諫早","長崎","人吉","屋久島","知覧","佐賀","天草","久米島","西都","別府","名護","壱岐","鹿児島","五島","奄美大島","鹿屋","石垣島","都城","竹田","枕崎","伊万里","対馬","秋月","八代","中津","糸島","茂木","大宜味","大分","飯塚","桜島","唐津","種子島","うるま","小城","金武"]};const LEVELS=[{n:'行ってない',e:'○'},{n:'通過した',e:'🚃'},{n:'歩いた',e:'👟'},{n:'飲んだ',e:'🍺'},{n:'泊まった',e:'🛏️'},{n:'住んだ',e:'🏠'}];const REGION_LAYOUT={"北海道":{x:930,y:120,w:180,h:250},"東北":{x:830,y:330,w:180,h:260},"関東":{x:790,y:610,w:210,h:210},"中部":{x:570,y:560,w:220,h:230},"近畿":{x:430,y:620,w:150,h:190},"中国":{x:260,y:610,w:170,h:180},"四国":{x:340,y:800,w:170,h:130},"九州・沖縄":{x:80,y:650,w:190,h:250}};const ALL=[];Object.entries(DATA).forEach(([region,names])=>{const box=REGION_LAYOUT[region],cols=Math.ceil(Math.sqrt(names.length*box.w/box.h)),rows=Math.ceil(names.length/cols);names.forEach((name,i)=>{const c=i%cols,r=Math.floor(i/cols);ALL.push({id:region+'-'+i,name,region,x:box.x+(c+.5)*box.w/cols,y:box.y+(r+.5)*box.h/rows})})});let V=JSON.parse(localStorage.getItem('nippon-loop-visits-v3')||'{}');let sel=null;const vp=document.getElementById('viewport'),svg=document.getElementById('map');let scale=1,tx=0,ty=0,drag=false,sx=0,sy=0;levelLegend.innerHTML=LEVELS.map((l,i)=>`<div class="levelKey"><span>${l.e}</span><br>${l.n}</div>`).join('');function levelOf(id){return Number(V[id]?.level||0)}function draw(){vp.innerHTML='';const regionOrder=Object.keys(DATA);for(let i=0;i<regionOrder.length-1;i++){const a=REGION_LAYOUT[regionOrder[i]],b=REGION_LAYOUT[regionOrder[i+1]],ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('x1',a.x+a.w/2);ln.setAttribute('y1',a.y+a.h/2);ln.setAttribute('x2',b.x+b.w/2);ln.setAttribute('y2',b.y+b.h/2);ln.setAttribute('class','route');vp.appendChild(ln)}ALL.forEach(s=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');const c=document.createElementNS('http://www.w3.org/2000/svg','circle');const t=document.createElementNS('http://www.w3.org/2000/svg','text');c.setAttribute('cx',s.x);c.setAttribute('cy',s.y);c.setAttribute('r',6);c.setAttribute('class','station s'+levelOf(s.id));t.setAttribute('x',s.x+8);t.setAttribute('y',s.y+2.5);t.setAttribute('class','stationLabel');t.textContent=s.name;g.append(c,t);g.addEventListener('click',e=>{e.stopPropagation();openStation(s)});vp.appendChild(g)});updateStats();applyTransform()}function updateStats(){const levels=ALL.map(s=>levelOf(s.id));const v=levels.filter(x=>x>=1).length,st=levels.filter(x=>x>=4).length;visited.textContent=v;stayed.textContent=st;left.textContent=ALL.length-v;pct.textContent=Math.round(v/ALL.length*100)+'%'}function openStation(s){sel=s;where.textContent=s.region;name.textContent=s.name;statusPicker.innerHTML=LEVELS.map((l,i)=>`<button class="statusChoice" data-level="${i}"><span>${l.e}</span>${l.n}</button>`).join('');statusPicker.querySelectorAll('button').forEach(b=>b.onclick=()=>{const lv=Number(b.dataset.level);if(lv===0)delete V[sel.id];else V[sel.id]={level:lv,updatedAt:new Date().toISOString()};localStorage.setItem('nippon-loop-visits-v3',JSON.stringify(V));modal.classList.add('hidden');draw()});modal.classList.remove('hidden')}closeModal.onclick=()=>modal.classList.add('hidden');modal.onclick=e=>{if(e.target===modal)modal.classList.add('hidden')};function applyTransform(){vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`)}zoomIn.onclick=()=>{scale=Math.min(3.5,scale*1.25);applyTransform()};zoomOut.onclick=()=>{scale=Math.max(.65,scale/1.25);applyTransform()};reset.onclick=()=>{scale=1;tx=0;ty=0;applyTransform()};svg.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;tx+=(e.clientX-sx)/scale;ty+=(e.clientY-sy)/scale;sx=e.clientX;sy=e.clientY;applyTransform()});svg.addEventListener('pointerup',()=>drag=false);svg.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.65,Math.min(3.5,scale*(e.deltaY<0?1.12:.89)));applyTransform()},{passive:false});draw();</script></body></html>
